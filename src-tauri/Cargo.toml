[package]
name = "font-hive"
version = "0.1.0"
description = "A local-first desktop font manager"
authors = ["Nitish"]
edition = "2021"
rust-version = "1.90"

[features]
custom-protocol = ["tauri/custom-protocol"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-updater = { version = "2", default-features = false, features = ["native-tls", "system-proxy"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.13", default-features = false, features = ["blocking", "json", "native-tls", "system-proxy"] }
tokio = { version = "1", features = ["sync", "time"] }
ttf-parser = "0.25"
wuff = "0.2"
walkdir = "2"
regex = "1"
url = "2"
fs2 = "0.4"
semver = "1"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_UI_WindowsAndMessaging", "Win32_Storage_FileSystem"] }
winreg = "0.55"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
